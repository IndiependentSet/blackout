# Local Supabase for this project: `npm run db:up` (tools/db-local.sh).
# Ports are 5532x, not Supabase's default 5432x, so this stack can run next to
# another local Supabase project (one that keeps the defaults).
# Only the services the app uses: Postgres, API (PostgREST), Auth, Realtime and Studio.
# The schema is NOT applied by the CLI: the migrations live in app/sql/ and run
# through tools/migrate.sh, exactly as they do in CI and production.
project_id = "blackout"

[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55322
shadow_port = 55320
major_version = 17

[db.migrations]
enabled = false

[db.seed]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 55323

[local_smtp]
enabled = true
port = 55324

[storage]
enabled = false

[auth]
enabled = true
# The dev server's port, not Vite's default 5173: another local Supabase project may own that one,
# and its login emails would open the wrong app.
site_url = "http://localhost:5180"
additional_redirect_urls = ["http://localhost:5180", "http://localhost:5180/**"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

# Logs analytics would take a port of its own (54327 by default, taken by another stack); the app doesn't use it.
[analytics]
enabled = false
