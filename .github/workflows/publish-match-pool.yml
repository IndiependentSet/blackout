name: publish-match-pool
# Publishes a fresh 1vs1 level pool every night (app/tools/publish-match-pool.ts), so ranked players do not meet the
# same maps for long. A second run later in the night is a safety net and does nothing if the first one finished.
# Uses the same secrets as publish-daily: SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY on the `production` environment.
on:
  schedule:
    - cron: '30 0 * * *'
    - cron: '45 0 * * *'
  workflow_dispatch:
    inputs:
      day:
        description: 'Puzzle day number that seeds the pool (empty = today, GMT)'
        required: false
permissions:
  contents: read
concurrency:
  group: publish-match-pool
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Check the secrets are set
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Set the SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY secrets on the 'production' environment."
            exit 1
          fi
      - name: Publish the pool
        env:
          DAY: ${{ inputs.day }}
        run: |
          if [ -n "$DAY" ]; then npm run match-pool:publish -- --day "$DAY"; else npm run match-pool:publish; fi
