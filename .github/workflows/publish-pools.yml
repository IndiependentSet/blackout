name: publish-pools
# One shot, run by hand (Actions > publish-pools > Run workflow): publishes the Voyage (campaign) and Meteor Rush
# (survival) pools when none exists yet (app/tools/publish-pools.ts). Never scheduled, never replaces a published pool.
# Same secrets as publish-daily: SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY on the `production` environment.
on:
  workflow_dispatch:
    inputs:
      modes:
        description: 'campaign, survival, or both (empty = both)'
        required: false
        type: choice
        default: ''
        options: ['', campaign, survival]
permissions:
  contents: read
concurrency:
  group: publish-pools
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Check the secrets are set
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Set the SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY secrets on the 'production' environment."
            exit 1
          fi
      - name: Publish the pools
        env:
          MODES: ${{ inputs.modes }}
        run: npm run pools:publish -- $MODES
